name: RBAC CI/CD Pipeline

'on':
  push:
    branches:
      - dev
      - main
      - feature/**
  pull_request:
    branches:
      - dev
      - main
  'workflow_dispatch':

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx2g -Xms512m'

jobs:
  test:
    name: Run Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java:
          - '17'
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Validate and Compile
        run: mvn -B validate compile --file pom.xml

      - name: Run All Unit Tests
        run: >
          mvn -B test
          -Dmaven.test.failure.ignore=false
          -Dsurefire.useFile=false
          -DtrimStackTrace=false
          -Djunit.jupiter.execution.parallel.enabled=true
          -Djunit.jupiter.execution.parallel.mode.default=concurrent
        env:
          CI: true
          LANG: en_US.UTF-8

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Class | Tests | Passed | Failed | Status |" \
            >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------|--------|--------|--------|" \
            >> $GITHUB_STEP_SUMMARY

          total_tests=0
          total_passed=0
          total_failed=0

          for file in target/surefire-reports/TEST-*.xml; do
            if [ -f "$file" ]; then
              name=$(basename "$file" .xml | sed 's/TEST-rbac\.//')
              tests=$(grep -oP 'tests="\K[^"]+' "$file" | head -1 || echo "0")
              failures=$(grep -oP 'failures="\K[^"]+' "$file" | head -1 || echo "0")
              errors=$(grep -oP 'errors="\K[^"]+' "$file" | head -1 || echo "0")
              skipped=$(grep -oP 'skipped="\K[^"]+' "$file" | head -1 || echo "0")
              passed=$((tests - failures - errors - skipped))

              total_tests=$((total_tests + tests))
              total_passed=$((total_passed + passed))
              total_failed=$((total_failed + failures + errors))

              if [ "$failures" = "0" ] && [ "$errors" = "0" ]; then
                status="PASS"
              else
                status="FAIL"
              fi

              echo "| $name | $tests | $passed | $((failures + errors)) | $status |" \
                >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total:** $total_tests tests, $total_passed passed, $total_failed failed" \
            >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/site/
          retention-days: 14
          if-no-files-found: warn

  coverage:
    name: Code Coverage (JaCoCo)
    runs-on: ubuntu-latest
    needs: test
    if: >
      github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests with JaCoCo
        run: mvn -B jacoco:prepare-agent test jacoco:report

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Print Coverage Summary
        run: |
          if [ -f "target/site/jacoco/index.html" ]; then
            echo "Coverage report generated: target/site/jacoco/index.html"
            if [ -f "target/site/jacoco/jacoco.xml" ]; then
              coverage=$(grep -oP 'type="INSTRUCTION" covered="\K[^"]+' \
                target/site/jacoco/jacoco.xml | head -1)
              total=$(grep -oP 'type="INSTRUCTION" missed="\K[^"]+' \
                target/site/jacoco/jacoco.xml | head -1)
              if [ -n "$coverage" ] && [ -n "$total" ]; then
                percent=$((coverage * 100 / (coverage + total)))
                echo "Coverage: ~$percent%"
              fi
            fi
          fi

  build:
    name: Build JAR Artifact
    runs-on: ubuntu-latest
    needs: test
    if: >
      github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build executable JAR
        run: mvn -B clean package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbac-application
          path: target/*.jar
          retention-days: 14

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs:
      - test
      - coverage
      - build
    if: always()

    steps:
      - name: Print Final Summary
        run: |
          echo "--------------------------------------------"
          echo "   RBAC CI Pipeline Completed"
          echo "--------------------------------------------"
          echo ""
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Actor:  ${{ github.actor }}"
          echo "  Event:  ${{ github.event_name }}"
          echo ""
          echo "  Tests:      ${{ needs.test.result }}"
          echo "  Coverage:   ${{ needs.coverage.result }}"
          echo "  Build:      ${{ needs.build.result }}"
          echo ""
          echo "  View artifacts in Actions tab"
          echo "--------------------------------------------"
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "   ALL TESTS PASSED - Ready for merge!"
          else
            echo "   Some tests failed - Check logs above"
          fi
          echo "--------------------------------------------"