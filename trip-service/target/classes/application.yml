server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/taxi_db
    username: taxi_user
    password: taxi_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: redis
      port: 6379

user:
  service:
    url: http://user-service:8080

notification:
  service:
    url: http://notification-service:8080

app:
  tariff-per-km: 50.0

logging:
  level:
    com.taxi.trip: DEBUG

jwt:
  secret: "mySuperSecretKeyForTaxiServiceMinimum32Chars!"
  expiration: 86400000