server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/taxi_db
    username: taxi_user
    password: taxi_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  worker:
    pool-size: 4
    max-retries: 3

logging:
  level:
    com.taxi.notification: DEBUG

jwt:
  secret: "mySuperSecretKeyForTaxiServiceMinimum32Chars!"
  expiration: 86400000