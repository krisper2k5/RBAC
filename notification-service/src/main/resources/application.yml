server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taxi_db
    username: taxi_user
    password: taxi_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  worker:
    pool-size: 4
    max-retries: 3

logging:
  level:
    com.taxi.notification: DEBUG